name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        # Lint the new/extracted modules. Extend to `ruff check .` once
        # remaining phases clear pre-existing violations in server/hub.py,
        # server/main.py, server/discovery.py, gui/ and legacy client code.
        run: ruff check client/clipboard_backend.py client/clipboard.py tests/test_regressions.py tests/test_m1_fixes.py server/auth.py server/filenames.py

      - name: Test (pytest)
        run: pytest -q
