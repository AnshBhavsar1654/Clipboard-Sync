[project]
name = "clipboardsync"
version = "0.2.0"
description = "Share clipboard text, photos, and files between a Windows PC and phones over local Wi-Fi. No cloud, no accounts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pywin32>=306",
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pywebview>=6.0.0",
    "pystray>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.5.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["B008", "B904", "E501"]  # FastAPI File()/HTTPException idioms
"server/hub.py" = ["E501"]
"server/admin.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["client", "server", "gui", "tests"]
